<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4efe6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eaddcf;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#d4af37;stop-opacity:0" />
    </radialGradient>
    <pattern id="starPattern" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <g stroke="#d1c7b8" stroke-width="0.5" fill="none" opacity="0.4">
        <path d="M60 0 L70 50 L120 60 L70 70 L60 120 L50 70 L0 60 L50 50 Z" />
        <rect x="20" y="20" width="80" height="80" transform="rotate(45 60 60)" />
        <rect x="20" y="20" width="80" height="80" />
      </g>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#skyGrad)" />
  <rect width="1600" height="900" fill="url(#starPattern)" />
  
  <!-- Subtle Sun -->
  <circle cx="1300" cy="200" r="300" fill="url(#sunGrad)" />

  <!-- Distant Mountains/Dunes -->
  <path d="M0 900 V700 Q 400 600, 800 750 T 1600 700 V900 Z" fill="#d3c2b0" opacity="0.5" />
  <path d="M0 900 V800 Q 300 750, 600 850 T 1200 800 T 1600 850 V900 Z" fill="#c4b2a0" opacity="0.7" />

  <!-- City Silhouette -->
  <g fill="#1e3b5a" opacity="0.8">
    <!-- Building 1 -->
    <rect x="100" y="650" width="150" height="150" />
    <path d="M100 650 Q 175 550, 250 650" />
    <rect x="165" y="500" width="20" height="150" />
    <path d="M165 500 L175 470 L185 500 Z" />
    
    <!-- Building 2 (Grand Mosque) -->
    <rect x="400" y="600" width="300" height="200" />
    <path d="M400 600 Q 550 450, 700 600" />
    <rect x="380" y="450" width="15" height="350" />
    <path d="M380 450 L387.5 420 L395 450 Z" />
    <rect x="705" y="450" width="15" height="350" />
    <path d="M705 450 L712.5 420 L720 450 Z" />
    
    <!-- Building 3 (Library) -->
    <rect x="850" y="680" width="200" height="120" />
    <path d="M850 680 L950 600 L1050 680 Z" />
    <rect x="940" y="550" width="20" height="130" />
    
    <!-- Building 4 -->
    <rect x="1200" y="620" width="100" height="180" />
    <path d="M1200 620 Q 1250 520, 1300 620" />
  </g>
  
  <!-- Foreground Detail -->
  <path d="M0 900 Q 400 850, 800 900 T 1600 880 V900 H0 Z" fill="#b08d57" opacity="0.3" />
</svg>
